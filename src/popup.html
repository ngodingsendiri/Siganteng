<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body{font-family:Inter,sans-serif;width:260px;padding:14px;margin:0;background:#fff;color:#232e3c}
.header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.header img{width:20px;height:20px}
h3{margin:0;font-size:14px;font-weight:700;letter-spacing:-0.2px}
.muted{color:#6c757d;font-size:11px;margin:2px 0 12px}
.card{border:1px solid #e3e8ef;border-radius:6px;padding:10px;background:#f8f9fb}
.row{display:flex;justify-content:space-between;padding:6px 0;font-size:11px}
.row+.row{border-top:1px solid #e3e8ef}
.label{color:#6c757d}
.value{font-weight:600;color:#232e3c}
.foot{margin-top:10px;text-align:center;font-size:10px;color:#9da9bb}
</style>
</head>
<body>
<div class="header"><img src="../assets/logo.svg"><h3>Siganteng</h3></div>
<p class="muted">Bulk kolektif SIKEREN — lebih ganteng dari Sikeren.</p>
<div class="card">
  <div class="row"><span class="label">Nama</span><span class="value">Siganteng</span></div>
  <div class="row"><span class="label">Versi</span><span class="value">1.0.13</span></div>
</div>
<div class="foot">flat • minimalis • <a href="https://startupmini.com" target="_blank" style="color:#2c7be5;text-decoration:none">startupmini.com</a></div>
</body>
</html>
